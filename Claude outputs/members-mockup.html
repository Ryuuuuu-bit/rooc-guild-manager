<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Members mockup</title>
<style>
  :root { --bg:#09090b; --panel:#18181b; --panel2:#1f1f23; --line:#27272a; --muted:#a1a1aa; --dim:#71717a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:#e4e4e7; font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:1240px; margin:0 auto; padding:24px 20px 60px; display:flex; flex-direction:column; gap:14px; }
  .note { background:rgba(56,189,248,.08); border:1px dashed rgba(56,189,248,.35); color:#bae6fd; border-radius:12px; padding:10px 14px; font-size:12px; }
  .head { display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; } h1 { font-size:24px; margin:0; font-weight:600; } .sub { color:var(--muted); margin-top:4px; }
  .head .right { margin-left:auto; display:flex; gap:8px; }
  .btn { background:var(--panel); border:1px solid var(--line); color:#d4d4d8; border-radius:10px; padding:7px 12px; font:inherit; font-size:12px; cursor:pointer; } .btn:hover { border-color:#3f3f46; }
  .kpis { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
  .kpi { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px; cursor:pointer; text-align:left; color:inherit; font:inherit; transition:.12s; }
  .kpi:hover { border-color:#3f3f46; } .kpi.on { border-color:rgba(245,158,11,.6); box-shadow:0 0 0 1px rgba(245,158,11,.3); }
  .kpi .l { font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); display:flex; align-items:center; gap:6px; } .kpi .v { font-size:24px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums; } .kpi .h { font-size:11px; color:var(--dim); }
  .dot { width:7px; height:7px; border-radius:50%; display:inline-block; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .search { position:relative; flex:0 1 300px; } .search input { width:100%; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 10px 8px 32px; color:#e4e4e7; font:inherit; } .search svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); width:15px; color:var(--dim); }
  .search kbd { position:absolute; right:8px; top:50%; transform:translateY(-50%); font-size:10px; color:var(--dim); border:1px solid var(--line); border-radius:5px; padding:0 5px; }
  .seg { display:inline-flex; gap:2px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:2px; }
  .seg button { background:none; border:0; color:var(--dim); padding:6px 10px; font:inherit; font-size:12px; font-weight:500; border-radius:9px; cursor:pointer; white-space:nowrap; } .seg button.on { background:#27272a; color:#f4f4f5; } .seg button .c { color:#52525b; margin-left:4px; font-variant-numeric:tabular-nums; } .seg button.on .c { color:#a1a1aa; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .chip { display:inline-flex; align-items:center; gap:5px; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:3px 10px 3px 8px; font-size:12px; cursor:pointer; color:#d4d4d8; user-select:none; }
  .chip:hover { border-color:#3f3f46; } .chip.on { border-color:rgba(245,158,11,.6); background:rgba(245,158,11,.1); color:#fde68a; } .chip .c { color:var(--dim); font-variant-numeric:tabular-nums; font-size:11px; }
  .chip.warn.on { border-color:rgba(244,63,94,.5); background:rgba(244,63,94,.1); color:#fda4af; }
  .lbl { font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:#52525b; margin-right:2px; }
  .box { border:1px solid var(--line); border-radius:16px; background:rgba(24,24,27,.5); overflow:auto; max-height:calc(100vh - 120px); scrollbar-width:thin; scrollbar-color:#52525b #18181b; }
  table { border-collapse:collapse; width:100%; min-width:980px; }
  thead th { position:sticky; top:0; z-index:5; background:#18181b; text-align:left; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); font-weight:500; padding:9px 12px; box-shadow:inset 0 -1px 0 var(--line); white-space:nowrap; cursor:pointer; user-select:none; } thead th.sorted { color:#fcd34d; }
  tbody td { padding:8px 12px; border-top:1px solid rgba(39,39,42,.7); vertical-align:middle; }
  tbody tr { cursor:pointer; transition:background .1s; } tbody tr:hover { background:rgba(39,39,42,.4); } tbody tr.sel { background:rgba(245,158,11,.06); }
  tbody tr.gone td { opacity:.5; }
  .m { display:flex; align-items:center; gap:10px; min-width:0; } .m .t { min-width:0; } .m .n { font-weight:600; color:#f4f4f5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px; } .m .u { font-size:11px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px; }
  .m .u .ign { color:#a1a1aa; } .m .u .miss { color:#fb7185; }
  .av { width:34px; height:34px; border-radius:50%; background:#3f3f46; flex:none; object-fit:cover; display:inline-flex; align-items:center; justify-content:center; font-size:12px; color:#e4e4e7; position:relative; }
  .avw { position:relative; flex:none; } .avw .st { position:absolute; right:-1px; bottom:-1px; width:11px; height:11px; border-radius:50%; box-shadow:0 0 0 2px #18181b; }
  .cls { display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:500; padding:1px 8px; border-radius:999px; white-space:nowrap; }
  .alts { display:inline-flex; gap:1px; margin-left:4px; background:rgba(24,24,27,.8); border-radius:999px; padding:0 5px; font-size:10px; box-shadow:inset 0 0 0 1px rgba(63,63,70,.6); vertical-align:middle; }
  .roles { display:flex; gap:4px; flex-wrap:wrap; max-width:190px; } .role { display:inline-flex; align-items:center; gap:4px; font-size:10.5px; color:#d4d4d8; background:#27272a; border-radius:999px; padding:1px 7px; }
  .spark { display:flex; gap:2px; align-items:flex-end; height:16px; } .spark i { width:6px; border-radius:1px; } .spark i.in { height:16px; background:#34d399; } .spark i.out { height:6px; background:#fb7185; } .spark i.na { height:3px; background:#3f3f46; }
  .pct { font-size:11px; color:var(--muted); margin-left:6px; font-variant-numeric:tabular-nums; }
  .num { font-variant-numeric:tabular-nums; } .q { font-variant-numeric:tabular-nums; font-size:12px; } .q.over { color:#fb7185; font-weight:600; } .q.zero { color:#52525b; }
  .pvp .cp { font-weight:600; color:#fde68a; font-variant-numeric:tabular-nums; } .pvp .ago { font-size:11px; color:var(--dim); } .pvp .ago.stale { color:#fb7185; }
  .stbadge { font-size:10.5px; font-weight:600; padding:1px 8px; border-radius:999px; }
  .s-act { background:rgba(16,185,129,.15); color:#6ee7b7; } .s-ben { background:rgba(245,158,11,.15); color:#fcd34d; } .s-left { background:#27272a; color:#a1a1aa; } .s-kick { background:rgba(244,63,94,.15); color:#fda4af; }
  .ten { font-size:12px; color:#d4d4d8; } .ten small { display:block; font-size:10.5px; color:var(--dim); }
  .kebab { background:none; border:0; color:var(--dim); font-size:16px; cursor:pointer; padding:2px 6px; border-radius:6px; } .kebab:hover { background:#27272a; color:#fff; }
  /* roster board */
  .board { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; }
  .col { background:rgba(24,24,27,.5); border:1px solid var(--line); border-radius:14px; padding:10px; }
  .col .hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; } .col .hd .c { font-size:11px; color:var(--dim); }
  .col .mini { display:flex; align-items:center; gap:8px; padding:5px 6px; border-radius:8px; cursor:pointer; } .col .mini:hover { background:#27272a; } .col .mini .av { width:24px; height:24px; font-size:10px; } .col .mini .n { font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .col .mini.b { opacity:.5; } .col .mini .tag { margin-left:auto; font-size:9px; }
  .col .sec { font-size:9.5px; color:#52525b; text-transform:uppercase; letter-spacing:.08em; margin:8px 6px 3px; }
  /* drawer */
  .scrim { position:fixed; inset:0; background:rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:.15s; z-index:40; } .scrim.show { opacity:1; pointer-events:auto; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:min(420px,100%); background:#141417; border-left:1px solid #3f3f46; transform:translateX(100%); transition:transform .2s ease; z-index:50; display:flex; flex-direction:column; }
  .drawer.show { transform:none; }
  .dh { padding:18px; border-bottom:1px solid var(--line); display:flex; gap:14px; align-items:center; position:relative; background:linear-gradient(160deg,rgba(245,158,11,.1),transparent 55%); }
  .dh .av { width:60px; height:60px; font-size:22px; } .dh .n { font-size:17px; font-weight:700; } .dh .u { font-size:12px; color:var(--dim); } .dh .x { position:absolute; right:12px; top:10px; background:none; border:0; color:var(--dim); font-size:18px; cursor:pointer; }
  .db { padding:16px 18px; overflow:auto; display:flex; flex-direction:column; gap:16px; }
  .sec2 { font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px; }
  .g3 { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; } .g3 div { background:#1c1c20; border-radius:10px; padding:9px; text-align:center; } .g3 b { display:block; font-size:17px; font-variant-numeric:tabular-nums; } .g3 span { font-size:10px; color:var(--dim); }
  .tl { display:flex; flex-direction:column; gap:8px; } .tl div { display:flex; gap:10px; font-size:12px; } .tl .d { color:var(--dim); width:64px; flex:none; font-size:11px; } .tl i { width:7px; height:7px; border-radius:50%; margin-top:5px; flex:none; }
  .acts { display:grid; grid-template-columns:1fr 1fr; gap:6px; } .acts button { background:#27272a; border:0; color:#e4e4e7; border-radius:9px; padding:8px; font:inherit; font-size:12px; cursor:pointer; } .acts button.pri { background:#d97706; color:#fff; grid-column:span 2; } .acts button.danger { color:#fda4af; }
  .bulk { position:sticky; bottom:12px; display:none; margin:0 auto; background:#27272a; border:1px solid #3f3f46; border-radius:14px; padding:8px 12px; gap:10px; align-items:center; box-shadow:0 10px 30px rgba(0,0,0,.5); width:max-content; z-index:20; } .bulk.show { display:flex; }
  .bulk button { background:#3f3f46; border:0; color:#fff; border-radius:8px; padding:5px 10px; font:inherit; font-size:12px; cursor:pointer; }
  input[type=checkbox] { accent-color:#f59e0b; width:15px; height:15px; }
</style>
</head>

const COLORS = { orange:["#fdba74","rgba(249,115,22,.15)"], yellow:["#fde68a","rgba(234,179,8,.15)"], violet:["#c4b5fd","rgba(139,92,246,.18)"], purple:["#d8b4fe","rgba(168,85,247,.16)"], rose:["#fda4af","rgba(244,63,94,.15)"], emerald:["#6ee7b7","rgba(16,185,129,.15)"], sky:["#7dd3fc","rgba(14,165,233,.15)"], red:["#fca5a5","rgba(239,68,68,.15)"], stone:["#d6d3d1","rgba(120,113,108,.2)"] };
const CLS = Object.fromEntries(DATA.classes.map(c=>[c.name,c]));
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clsBadge = n => { if(!n) return `<span style="color:#52525b">—</span>`; const c=CLS[n]; const [fg,bg]=COLORS[c?.color_key]||COLORS.stone; return `<span class="cls" style="color:${fg};background:${bg}">${c?.emoji||""} ${esc(n)}</span>`; };
const av = (m,cls="av") => m.avatar ? `<img class="${cls}" src="${esc(m.avatar)}" alt="" onerror="this.outerHTML='<span class=&quot;${cls}&quot;>${esc(m.name).slice(0,1)}</span>'">` : `<span class="${cls}">${esc(m.name).slice(0,1)}</span>`;

// ---- illustrative extra fields ----
let seed=17; const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
const ROLES = { Rooc:"#ef4444", MOD:"#f97316", Strategist:"#3b82f6" };
const NOW = new Date("2026-09-24T12:00:00+07:00");
const M = DATA.rows.map((r,i)=>{
  const joined = new Date(NOW - (20 + Math.floor(rnd()*260))*864e5);
  const att = Array.from({length:8},()=> rnd()<.85 ? "in" : "out"); if (joined > NOW - 30*864e5) { att[0]="na"; att[1]="na"; att[2]="na"; }
  const pvpAgo = r.cp==null ? null : Math.floor(rnd()<.7 ? rnd()*10 : 10+rnd()*30);
  return { ...r, username: "@"+(r.name.replace(/[^a-z0-9_.]/gi,"").toLowerCase().slice(0,14) || "user"+i),
    ign: rnd()<.88 ? r.name : null, roles: ["Rooc", ...(rnd()<.1?["MOD"]:[]), ...(rnd()<.05?["Strategist"]:[])],
    status: "ACTIVE", benched: false, joined, att, leaves: Math.floor(rnd()*rnd()*4), pvpAgo };
});
[7,19,33,52,64].forEach(i=>M[i].benched=true);
M.push(...[["xXSlayerXx","DoramSTR","LEFT"],["MinnieMouse","Priest","LEFT"],["Grumpy","Bio","KICKED"]].map(([n,c,s],i)=>({ id:"x"+i, name:n, avatar:null, cls:c, alts:[], username:"@"+n.toLowerCase(), ign:n, roles:[], status:s, benched:false, joined:new Date(NOW-200*864e5), att:Array(8).fill("na"), leaves:0, cp:null, pvpAgo:null })));
const attPct = m => { const v=m.att.filter(x=>x!=="na"); return v.length? Math.round(v.filter(x=>x==="in").length/v.length*100) : null; };
const isAct = m => m.status==="ACTIVE";
const tenure = d => { const days=Math.floor((NOW-d)/864e5); return days<30?`${days}d`:days<365?`${Math.floor(days/30)} mo`:`${(days/365).toFixed(1)} y`; };
const ATTN = [
  ["noclass","No class",m=>isAct(m)&&!m.cls],
  ["noign","No in-game name",m=>isAct(m)&&!m.ign],
  ["pvp","PVP stale / missing",m=>isAct(m)&&!m.benched&&(m.pvpAgo==null||m.pvpAgo>14)],
  ["quota","Over leave quota",m=>isAct(m)&&m.leaves>2],
  ["lowatt","Attendance < 60%",m=>isAct(m)&&!m.benched&&attPct(m)!==null&&attPct(m)<60],
  ["new","Joined < 30 days",m=>isAct(m)&&(NOW-m.joined)<30*864e5],
];
let status="current", cls=null, attn=null, q="", view="table", sort={k:"name",dir:1}, sel=new Set(), open=null;

function base(){ return M.filter(m=> status==="current"?isAct(m) : status==="active"?isAct(m)&&!m.benched : status==="benched"?isAct(m)&&m.benched : status==="left"?!isAct(m) : true); }
function filtered(){ const f=ATTN.find(a=>a[0]===attn)?.[2];
  return base().filter(m=>(!cls||m.cls===cls||m.alts?.includes(cls)) && (!f||f(m)) && (!q||[m.name,m.username,m.ign].some(x=>x&&x.toLowerCase().includes(q)))); }

function renderTop(){
  const cur=M.filter(isAct), act=cur.filter(m=>!m.benched), ben=cur.filter(m=>m.benched), gone=M.filter(m=>!isAct(m)), newb=cur.filter(m=>(NOW-m.joined)<30*864e5);
  const avgAtt=Math.round(act.map(attPct).filter(x=>x!=null).reduce((a,b,_,arr)=>a+b/arr.length,0));
  document.getElementById("sub").textContent=`${cur.length} current members · ${gone.length} left or kicked`;
  document.getElementById("kpis").innerHTML=[
    ["active","#34d399","Active",act.length,"playing, not benched"],
    ["benched","#fbbf24","Benched",ben.length,"out of party & loot"],
    ["new","#38bdf8","New (30 days)",newb.length,"joined this month"],
    ["att","#a78bfa","Avg attendance",avgAtt+"%","last 8 rounds"],
    ["left","#71717a","Left / kicked",gone.length,"kept for history"],
  ].map(([k,c,l,v,h])=>`<button class="kpi ${(k==="active"&&status==="active")||(k==="benched"&&status==="benched")||(k==="left"&&status==="left")||(k==="new"&&attn==="new")?"on":""}" data-k="${k}"><div class="l"><span class="dot" style="background:${c}"></span>${l}</div><div class="v">${v}</div><div class="h">${h}</div></button>`).join("");
  const counts={current:cur.length,active:act.length,benched:ben.length,left:gone.length,all:M.length};
  document.getElementById("segStatus").innerHTML=[["current","Current"],["active","Active"],["benched","Benched"],["left","Left/Kicked"],["all","All"]].map(([k,l])=>`<button data-s="${k}" class="${status===k?"on":""}">${l}<span class="c">${counts[k]}</span></button>`).join("");
  const b=base(); const byCls={}; b.forEach(m=>{ if(m.cls) byCls[m.cls]=(byCls[m.cls]||0)+1; });
  document.getElementById("classChips").innerHTML=`<span class="lbl">Class</span>`+Object.entries(byCls).sort((a,b)=>b[1]-a[1]).map(([c,n])=>{ const [fg]=COLORS[CLS[c]?.color_key]||COLORS.stone; return `<span class="chip ${cls===c?"on":""}" data-c="${esc(c)}"><span style="color:${fg}">${CLS[c]?.emoji||""}</span>${esc(c)}<span class="c">${n}</span></span>`; }).join("");
  document.getElementById("attnChips").innerHTML=`<span class="lbl">Needs attention</span>`+ATTN.map(([k,l,f])=>{ const n=M.filter(f).length; return n?`<span class="chip warn ${attn===k?"on":""}" data-a="${k}">${l}<span class="c">${n}</span></span>`:""; }).join("");
}
function sortRows(list){ const k=sort.k, d=sort.dir; const val=m=> k==="name"?m.name.toLowerCase(): k==="cls"?(CLS[m.cls]?.sort_order??99): k==="att"?(attPct(m)??-1): k==="leaves"?m.leaves: k==="cp"?(m.cp??-1): k==="joined"?+m.joined: 0;
  return [...list].sort((a,b)=>{ const x=val(a), y=val(b); return (x<y?-1:x>y?1:0)*d; }); }
function renderTable(){
  const list=sortRows(filtered());
  const th=(k,l)=>`<th data-k="${k}" class="${sort.k===k?"sorted":""}">${l} <span style="font-size:9px;opacity:${sort.k===k?1:.3}">${sort.k===k&&sort.dir<0?"▼":"▲"}</span></th>`;
  document.getElementById("view").innerHTML=`<div class="box"><table><thead><tr><th style="width:34px"><input type="checkbox" id="all"></th>${th("name","Member")}${th("cls","Class")}<th>Roles</th>${th("att","Attendance · 8 rounds")}${th("leaves","Leaves (Sep)")}${th("cp","PVP")}${th("joined","Joined")}<th>Status</th><th></th></tr></thead><tbody>${
    list.map(m=>{ const p=attPct(m), stColor=!isAct(m)?"#71717a":m.benched?"#fbbf24":"#34d399";
      return `<tr data-id="${m.id}" class="${sel.has(m.id)?"sel":""} ${!isAct(m)?"gone":""}">
      <td onclick="event.stopPropagation()"><input type="checkbox" data-cb="${m.id}" ${sel.has(m.id)?"checked":""}></td>
      <td><div class="m"><span class="avw">${av(m)}<span class="st" style="background:${stColor}"></span></span><div class="t"><div class="n">${esc(m.name)}</div><div class="u">${esc(m.username)}${m.ign?(m.ign===m.name?"":` · <span class="ign">IGN ${esc(m.ign)}</span>`):` · <span class="miss">no IGN</span>`}</div></div></div></td>
      <td>${clsBadge(m.cls)}${m.alts?.length?`<span class="alts" title="รอง: ${esc(m.alts.join(", "))}">${m.alts.map(a=>CLS[a]?.emoji||"").join("")}</span>`:""}</td>
      <td><div class="roles">${m.roles.map(r=>`<span class="role"><span class="dot" style="background:${ROLES[r]}"></span>${r}</span>`).join("")||`<span style="color:#52525b">—</span>`}</div></td>
      <td><div style="display:flex;align-items:center"><div class="spark" title="เก่า → ใหม่">${[...m.att].reverse().map(a=>`<i class="${a}"></i>`).join("")}</div><span class="pct" style="${p!==null&&p<60?"color:#fb7185":""}">${p===null?"new":p+"%"}</span></div></td>
      <td><span class="q ${m.leaves>2?"over":m.leaves===0?"zero":""}">${m.leaves}/2${m.leaves>2?" ⚠":""}</span></td>
      <td class="pvp">${m.cp!=null?`<div class="cp">${m.cp.toLocaleString("th-TH")}</div><div class="ago ${m.pvpAgo>14?"stale":""}">${m.pvpAgo===0?"today":m.pvpAgo+"d ago"}</div>`:`<span class="ago stale">not submitted</span>`}</td>
      <td><div class="ten">${tenure(m.joined)}<small>${m.joined.toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"2-digit"})}</small></div></td>
      <td><span class="stbadge ${!isAct(m)?(m.status==="KICKED"?"s-kick":"s-left"):m.benched?"s-ben":"s-act"}">${!isAct(m)?(m.status==="KICKED"?"Kicked":"Left"):m.benched?"Benched":"Active"}</span></td>
      <td><button class="kebab" title="Actions">⋯</button></td></tr>`; }).join("") || `<tr><td colspan="10" style="text-align:center;padding:40px;color:#71717a">No members match</td></tr>`
  }</tbody></table></div>`;
}
function renderRoster(){
  const list=filtered(); const byCls={}; list.forEach(m=>(byCls[m.cls||"—"] ??= []).push(m));
  document.getElementById("view").innerHTML=`<div class="board">${Object.entries(byCls).sort((a,b)=>b[1].length-a[1].length).map(([c,ms])=>{ const act=ms.filter(m=>!m.benched&&isAct(m)), ben=ms.filter(m=>m.benched||!isAct(m));
    const mini=m=>`<div class="mini ${m.benched||!isAct(m)?"b":""}" data-id="${m.id}">${av(m)}<span class="n">${esc(m.name)}</span>${m.alts?.length?`<span class="tag">${m.alts.map(a=>CLS[a]?.emoji).join("")}</span>`:""}</div>`;
    return `<div class="col"><div class="hd">${c==="—"?"No class":clsBadge(c)}<span class="c">${act.length}${ben.length?` + ${ben.length} benched`:""}</span></div>${act.map(mini).join("")}${ben.length?`<div class="sec">Benched / gone</div>${ben.map(mini).join("")}`:""}</div>`; }).join("")}</div>`;
}
function renderBulk(){ const b=document.getElementById("bulk"); b.classList.toggle("show",sel.size>0); b.innerHTML=`<b>${sel.size} selected</b><button>Bench</button><button>Set class…</button><button>Copy @mentions</button><button id="clr" style="background:none;color:#a1a1aa">Clear</button>`; }
function renderDrawer(){
  const d=document.getElementById("drawer"), s=document.getElementById("scrim"); const m=M.find(x=>x.id===open);
  d.classList.toggle("show",!!m); s.classList.toggle("show",!!m); if(!m) return;
  const p=attPct(m);
  d.innerHTML=`<div class="dh">${av(m)}<div><div class="n">${esc(m.name)}</div><div class="u">${esc(m.username)}${m.ign?` · IGN ${esc(m.ign)}`:""}</div><div style="margin-top:6px;display:flex;gap:5px;flex-wrap:wrap">${clsBadge(m.cls)}${(m.alts||[]).map(clsBadge).join("")}</div></div><button class="x" id="dx">✕</button></div>
  <div class="db">
    <div class="g3"><div><b style="color:${p!==null&&p<60?"#fb7185":"#6ee7b7"}">${p===null?"—":p+"%"}</b><span>attendance</span></div><div><b style="color:${m.leaves>2?"#fb7185":"#e4e4e7"}">${m.leaves}/2</b><span>leaves Sep</span></div><div><b style="color:#fde68a">${m.cp!=null?(m.cp/1000).toFixed(0)+"k":"—"}</b><span>CP</span></div></div>
    <div><div class="sec2">Last 8 rounds</div><div class="spark" style="height:22px">${[...m.att].reverse().map(a=>`<i class="${a}" style="width:14px;${a==="in"?"height:22px":""}"></i>`).join("")}</div></div>
    <div><div class="sec2">Recent activity</div><div class="tl">
      <div><span class="d">22 ก.ย.</span><i style="background:#fbbf24"></i>ลา GL (Tyr Cup) — ติดงาน</div>
      <div><span class="d">20 ก.ย.</span><i style="background:#34d399"></i>อัปเดต PVP stats · CP ${m.cp?m.cp.toLocaleString():"—"}</div>
      ${m.alts?.length?`<div><span class="d">12 ก.ย.</span><i style="background:#a78bfa"></i>เพิ่มอาชีพรอง ${esc(m.alts[0])}</div>`:""}
      <div><span class="d">${m.joined.toLocaleDateString("th-TH",{day:"numeric",month:"short"})}</span><i style="background:#38bdf8"></i>เข้ากิลด์</div></div></div>
    <div><div class="sec2">Admin note</div><div style="background:#1c1c20;border-radius:10px;padding:10px;font-size:12px;color:#a1a1aa">ตัวหลัก WOE ปาร์ตี้ 2 · ขอเล่น Priest วันอาทิตย์</div></div>
    <div class="acts"><button class="pri">Open full profile →</button><button>Edit class</button><button>${m.benched?"Unbench":"Bench"}</button><button>Log leave</button><button class="danger">Mark as kicked</button></div>
  </div>`;
}
function render(){ renderTop(); view==="table"?renderTable():renderRoster(); renderBulk(); renderDrawer(); }
document.getElementById("kpis").onclick=e=>{ const k=e.target.closest(".kpi")?.dataset.k; if(!k) return; if(k==="active") status=status==="active"?"current":"active"; else if(k==="benched") status=status==="benched"?"current":"benched"; else if(k==="left") status=status==="left"?"current":"left"; else if(k==="new") attn=attn==="new"?null:"new"; render(); };
document.getElementById("segStatus").onclick=e=>{ const s=e.target.closest("button")?.dataset.s; if(s){ status=s; render(); } };
document.getElementById("classChips").onclick=e=>{ const c=e.target.closest(".chip")?.dataset.c; if(c){ cls=cls===c?null:c; render(); } };
document.getElementById("attnChips").onclick=e=>{ const a=e.target.closest(".chip")?.dataset.a; if(a){ attn=attn===a?null:a; if(attn) status="current"; render(); } };
document.getElementById("segView").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; view=b.dataset.v; [...e.currentTarget.children].forEach(x=>x.classList.toggle("on",x===b)); render(); };
document.getElementById("q").oninput=e=>{ q=e.target.value.trim().toLowerCase(); view==="table"?renderTable():renderRoster(); };
document.addEventListener("keydown",e=>{ if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){ e.preventDefault(); document.getElementById("q").focus(); } if(e.key==="Escape"){ open=null; renderDrawer(); } });
document.getElementById("view").onclick=e=>{
  const h=e.target.closest("th[data-k]"); if(h){ const k=h.dataset.k; sort=sort.k===k?{k,dir:-sort.dir}:{k,dir:k==="name"||k==="cls"?1:-1}; renderTable(); return; }
  const cb=e.target.closest("[data-cb]"); if(cb){ sel.has(cb.dataset.cb)?sel.delete(cb.dataset.cb):sel.add(cb.dataset.cb); renderTable(); renderBulk(); return; }
  if(e.target.id==="all"){ const ids=filtered().map(m=>m.id); const allOn=ids.every(i=>sel.has(i)); ids.forEach(i=>allOn?sel.delete(i):sel.add(i)); renderTable(); renderBulk(); return; }
  const r=e.target.closest("[data-id]"); if(r && !e.target.closest(".kebab")){ open=r.dataset.id; renderDrawer(); }
};
document.getElementById("bulk").onclick=e=>{ if(e.target.id==="clr"){ sel.clear(); render(); } };
document.getElementById("scrim").onclick=()=>{ open=null; renderDrawer(); };
document.getElementById("drawer").onclick=e=>{ if(e.target.id==="dx"){ open=null; renderDrawer(); } };
render();
</script>
